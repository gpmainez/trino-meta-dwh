version: '3.8'

services:
  # 1. MinIO: Local S3-compatible Object Storage for Apache Iceberg
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: trino_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 2. MinIO Init: Automatically create the required S3 bucket
  mc:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: trino_mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set localminio http://minio:9000 admin password123;
      /usr/bin/mc mb localminio/warehouse || true;
      exit 0;
      "

  # 3. Trino Coordinator: Distributed Query Engine with native Iceberg Connector
  trino:
    image: trinodb/trino:446
    container_name: trino_coordinator
    depends_on:
      - minio
    ports:
      - "8080:8080"
    volumes:
      - ./docker/trino/etc/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro

volumes:
  minio_data:
