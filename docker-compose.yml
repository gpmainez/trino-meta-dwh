version: '3.8'

services:
  # 1. MinIO: Local S3-compatible Object Storage for Apache Iceberg
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: trino_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 2. MinIO Init: Automatically create the required 'warehouse' bucket
  mc:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: trino_mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set localminio http://minio:9000 admin password123;
      /usr/bin/mc mb localminio/warehouse || true;
      exit 0;
      "

  # 3. Iceberg REST Catalog: Community-standard catalog fixture for Apache Iceberg
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: trino_iceberg_rest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH_STYLE_ACCESS: "true"
    ports:
      - "8181:8181"

  # 4. Trino Coordinator: Distributed Query Engine with Iceberg REST Connector
  trino:
    image: trinodb/trino:446
    container_name: trino_coordinator
    depends_on:
      - iceberg-rest
    ports:
      - "8080:8080"
    volumes:
      - ./docker/trino/etc/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro

volumes:
  minio_data:
