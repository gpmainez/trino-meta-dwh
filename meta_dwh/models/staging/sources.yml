version: 2

sources:
  - name: trino_source
    description: "Raw events emitted by Trino EventListener (QueryCompletedEvent) and stored as Apache Iceberg on Amazon S3."
    schema: "{{ var('raw_schema', 'events') }}"
    database: "{{ var('raw_catalog', 'iceberg') }}"
    tables:
      - name: raw_trino_events
        description: "Append-only raw telemetry data containing query execution details, resource consumption, and referenced tables."
        columns:
          - name: query_id
            description: "Globally unique query execution identifier generated by Trino Coordinator."
            tests:
              - not_null
              - unique

          - name: user_name
            description: "System/LDAP/Kerberos principal or service account initiating the query."
            tests:
              - not_null

          - name: query_state
            description: "Final terminal state of the query execution: FINISHED, FAILED, USER_CANCELED, etc."
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['FINISHED', 'FAILED', 'USER_CANCELED', 'USER_ERROR', 'INSUFFICIENT_RESOURCES']

          - name: cpu_time_ms
            description: "Aggregated CPU time consumed by all worker nodes in milliseconds."
            tests:
              - not_null

          - name: wall_time_ms
            description: "Total elapsed clock time (duration) from query planning to final row completion in milliseconds."

          - name: bytes_scanned
            description: "Total physical/processed data bytes read from storage (e.g. S3 Parquet data)."
            tests:
              - not_null

          - name: peak_memory_bytes
            description: "Maximum peak cumulative memory footprint in bytes across Trino workers."

          - name: start_time
            description: "Timestamp (with time zone) when Trino Coordinator received and began scheduling the query."
            tests:
              - not_null

          - name: completion_time
            description: "Timestamp (with time zone) when the query finished and all stats were flushed."
            tests:
              - not_null

          - name: tables
            description: "Array of fully qualified table names accessed during query execution (format: catalog.schema.table)."
