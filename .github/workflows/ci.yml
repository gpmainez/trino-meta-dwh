name: dbt CI Validation & Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Fast Static Validation (dbt parse)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt-trino
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-trino

      - name: Validate dbt Syntax, DAG & Tests
        working-directory: meta_dwh
        run: |
          dbt parse --profiles-dir .

  integration-test:
    name: End-to-End Trino & Iceberg Integration Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-trino trino

      - name: Start Docker Stack (Trino + Iceberg REST + MinIO)
        run: |
          docker compose up -d
          docker compose ps

      - name: Wait for Trino Coordinator & REST Catalog
        run: |
          echo "Waiting for Trino coordinator readiness..."
          for i in {1..60}; do
            if curl -s -f http://localhost:8080/v1/info | grep -q '"starting":false'; then
              echo "Trino coordinator is ready!"
              exit 0
            fi
            echo "Waiting for Trino... ($i/60)"
            sleep 3
          done
          echo "ERROR: Trino coordinator timed out."
          docker compose logs trino
          exit 1

      - name: Ingest Mock Telemetry Data
        run: |
          python scripts/generate_mock_events.py --count 1000 --days 14

      - name: Execute dbt Seed & Pipeline Build
        working-directory: meta_dwh
        run: |
          dbt seed --profiles-dir .
          dbt run --profiles-dir .
          dbt test --profiles-dir .

      - name: Verify Analytical Queries
        working-directory: meta_dwh
        run: |
          dbt compile --profiles-dir .

      - name: Shutdown Docker Stack
        if: always()
        run: |
          docker compose down -v
