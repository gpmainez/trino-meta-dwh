name: dbt CI Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate dbt Models, Macros & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-trino trino

      - name: Validate dbt Models, DAG & 57 Tests
        working-directory: meta_dwh
        run: |
          dbt parse --profiles-dir .

      - name: Validate Telemetry Generator (Dry Run)
        run: |
          python scripts/generate_mock_events.py --count 100 --dry-run
